<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Haarwerk – Termin anfragen</title>
<style>
:root{--bg:#f6f1ec;--sf:#fff;--tx:#241c18;--mu:#7a6b62;--bd:#e5dbd2;--ac:#b4532a;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1c1613;--sf:#261e1a;--tx:#f3ebe5;--mu:#b3a39a;--bd:#3a2f29;--ac:#e08a5f;--on:#1c1613}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.c{width:100%;max-width:460px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
form{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px}
label{display:block;font-size:14px;color:var(--mu);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:14px}
textarea{min-height:100px;resize:vertical}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mu);margin-bottom:16px}
.ck input{width:auto;margin:3px 0 0}
button{width:100%;font:inherit;font-weight:600;background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.ok,.er{display:none;padding:14px;border-radius:10px;margin-top:14px;font-size:15px}
.ok{background:#e6f4ea;color:#14532d}.er{background:#fde8e8;color:#8a1c1c}
.hp{position:absolute;left:-9999px}
</style></head><body>
<div class="c">
<h1>Studio Haarwerk</h1>
<p class="sub">Schreiben Sie uns kurz, wir melden uns sofort mit einem Terminvorschlag.</p>
<form id="f">
<label for="name">Name</label><input id="name" name="name" required autocomplete="name">
<label for="email">E-Mail</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="phone">Telefon (optional)</label><input id="phone" name="phone" type="tel" autocomplete="tel">
<label for="message">Ihre Nachricht</label><textarea id="message" name="message" required></textarea>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<label class="ck"><input type="checkbox" required> Ich stimme zu, dass meine Angaben zur Bearbeitung meiner Anfrage gespeichert werden. Mehr dazu in der Datenschutzerklärung.</label>
<button id="b" type="submit">Anfrage senden</button>
</form>
<div class="ok" id="ok">Vielen Dank! Wir haben Ihnen soeben eine E-Mail mit einem Buchungslink geschickt.</div>
<div class="er" id="er">Das hat leider nicht geklappt. Bitte versuchen Sie es später noch einmal.</div>
</div>
<script>
// HIER anpassen: Production-URL aus der App unter Einstellungen
var WEBHOOK ="https://anfragenpilot.app.n8n.cloud/webhook/anfrage-v2?business_id=9fb18383-1d25-46eb-9451-9b7702703d15";

document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target, b = document.getElementById("b");
  if (f.website.value) return; // Spam-Falle
  b.disabled = true; b.textContent = "Wird gesendet …";
  document.getElementById("ok").style.display = "none";
  document.getElementById("er").style.display = "none";
  var data = new URLSearchParams({ name: f.name.value, email: f.email.value, phone: f.phone.value, message: f.message.value });
  fetch(WEBHOOK, { method: "POST", body: data })
    .then(function (r) { if (!r.ok) throw new Error(r.status); document.getElementById("ok").style.display = "block"; f.reset(); })
    .catch(function () { document.getElementById("er").style.display = "block"; })
    .finally(function () { b.disabled = false; b.textContent = "Anfrage senden"; });
});
</script>
</body></html>
